- name: 公司池官方招聘页轮询
  type: company_pool_html
  tier: 1
  daily_company_ids: [airwallex, xtransfer, payermax, unionpay, unionpay_intl, ccbc, cips, shch, cfets, lianlian, srcb]
  rotate_priorities: [P0, P1]
  rotation_buckets: 7
  max_rotating: 10
  include: [job, career, 招聘, 校园, 校招, 实习, graduate, analyst, risk, compliance, product, data]
  exclude: [privacy, cookie, terms, fraud-and-third-party-recruiters]

- name: Airwallex官方职位
  type: generic_html
  company_id: airwallex
  url: https://careers.airwallex.com/jobs/
  tier: 1
  include: ["/job/", "analyst", "risk", "compliance", "product", "operations", "graduate"]
  exclude: ["privacy", "fraud-and-third-party-recruiters"]

- name: 上海国资委国企招聘
  type: generic_html
  url: https://www.gzw.sh.gov.cn/shgzw_xxgk_cqzp/index.html
  tier: 1
  allow_unmatched: true
  default_location: 上海
  include: ["招聘", "校招", "校园", "实习", "应届", "提前批", "管培"]

- name: 中国银联招聘官网
