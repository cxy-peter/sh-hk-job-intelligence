- name: 公共Web搜索-官网与提前批
  type: web_search
  enabled: true
  allow_unmatched: true
  tier: 2
  max_results: 12
  queries:
    - '2027届 校招 提前批 上海 跨境支付 风控 合规 产品 数据分析'
    - '2027届 秋招 上海 国企 金融科技 风险管理 数据分析'
    - '2027 graduate Hong Kong fintech payment risk compliance analyst'
    - 'site:gzw.sh.gov.cn/shgzw_xxgk_cqzp 2027届 招聘 提前批'
    - 'site:mp.weixin.qq.com 2027届 校招 支付 风控 上海 香港'
    - 'site:xiaohongshu.com 2027秋招 支付 风控 上海 香港'

- name: 实习僧Skill本地导出
  type: local_csv
  enabled: true
  path: data/external/shixiseng_jobs.csv
  tier: 3
  allow_unmatched: true
  company_field: company
  title_field: title
  location_field: city
  deadline_field: deadline
  url_field: url
  description_field: job_description
  published_field: refresh_time
